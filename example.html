<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive Multi-Display ASCII Dashboard</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #121212;
            color: #e0e0e0;
            font-family: system-ui, -apple-system, sans-serif;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }

        /* Top navigation header */
        header {
            background-color: #1a1a1a;
            padding: 15px 20px;
            border-bottom: 1px solid #333;
        }
        header h1 { font-size: 1.5rem; margin-bottom: 5px; color: #00ffaa; }
        header p { font-size: 0.9rem; color: #888; }

        /* Main app layout area */
        .dashboard-content {
            display: flex;
            flex: 1;
            overflow: hidden;
            padding: 20px;
            gap: 20px;
        }

        /* Control Panel Sidebar */
        .sidebar {
            width: 280px;
            background-color: #1a1a1a;
            border: 1px solid #333;
            border-radius: 8px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .sidebar button {
            background-color: #00ffaa;
            color: #000;
            border: none;
            padding: 10px;
            font-weight: bold;
            border-radius: 4px;
            cursor: pointer;
        }
        .sidebar button:hover { background-color: #00cc88; }

        /* Workspace holding our terminal instances */
        .workspace {
            flex: 1;
            display: flex;
            gap: 20px;
            /* Allow child containers to stretch and shrink fluidly */
            min-width: 0; 
        }

        /* Responsive Target Box for an ASCII Terminal instance */
        .terminal-panel {
            flex: 1;
            background-color: #050505;
            border: 1px solid #333;
            border-radius: 8px;
            padding: 15px;
            display: flex;
            flex-direction: column;
            min-width: 0; /* Prevents flex items from busting out of parent */
        }
        .terminal-panel h3 { margin-bottom: 10px; font-size: 1rem; color: #aaa; }
        
        /* THE PARENT SLOT: The widget fills this container exactly */
        .display-slot {
            flex: 1;
            width: 100%;
            height: 100%;
            min-height: 0; /* Crucial: allows inner element to shrink past text content dimensions */
            position: relative;
        }

        /* ---------------------------------------------------- */
        /* ENGINES STYLES: Injected/Controlled by the Component */
        /* ---------------------------------------------------- */
        .ascii-wrapper {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            display: block;
        }

        .ascii-grid {
            display: grid;
            width: 100%;
            height: 100%;
            font-family: 'Courier New', Courier, monospace;
            font-weight: bold;
            user-select: none;
            background-color: #000;
        }

        .ascii-grid span {
            display: flex;
            justify-content: center;
            align-items: center;
            aspect-ratio: 1;
            line-height: 1;
            overflow: hidden;
        }
    </style>
</head>
<body>

    <header>
        <h1>ASCII Engine Dashboard</h1>
        <p>Dynamic responsive canvas allocation with localized ResizeObservers.</p>
    </header>

    <div class="dashboard-content">
        <aside class="sidebar">
            <h3>Controls</h3>
            <p>The displays on the right adapt to fit their surrounding layout panels instantly on window resize.</p>
            <button id="btn-clear">Clear Displays</button>
            <button id="btn-invert">Invert Backdrops</button>
        </aside>

        <main class="workspace">
            <!-- Terminal Panel 1: Widescreen Layout -->
            <div class="terminal-panel">
                <h3>Terminal A (Widescreen 120x40)</h3>
                <div id="slot-a" class="display-slot"></div>
            </div>

            <!-- Terminal Panel 2: Tall Column Layout -->
            <div class="terminal-panel">
                <h3>Terminal B (Portrait 40x60)</h3>
                <div id="slot-b" class="display-slot"></div>
            </div>
        </main>
    </div>

    <script>
        class ResponsiveAsciiTerminal {
            constructor(parentSelector, width, height, defaultChar = ' ', defaultColor = '#222') {
                this.parentContainer = document.querySelector(parentSelector);
                this.width = width;
                this.height = height;
                this.defaultChar = defaultChar;
                this.defaultColor = defaultColor;
                
                this.totalCells = width * height;
                this.aspectRatio = width / height;

                // Framebuffers
                this.charBuffer = new Array(this.totalCells).fill(defaultChar);
                this.colorBuffer = new Array(this.totalCells).fill(defaultColor);
                this.domCache = new Array(this.totalCells);

                this.buildDOM();
                this.setupResizer();
            }

            buildDOM() {
                // Outer structural layout wrappers
                this.wrapper = document.createElement('div');
                this.wrapper.className = 'ascii-wrapper';

                this.grid = document.createElement('div');
                this.grid.className = 'ascii-grid';
                this.grid.style.gridTemplateColumns = `repeat(${this.width}, 1fr)`;
                this.grid.style.gridTemplateRows = `repeat(${this.height}, 1fr)`;

                const fragment = document.createDocumentFragment();
                for (let i = 0; i < this.totalCells; i++) {
                    const cell = document.createElement('span');
                    cell.textContent = this.charBuffer[i];
                    cell.style.color = this.colorBuffer[i];
                    this.domCache[i] = cell;
                    fragment.appendChild(cell);
                }

                this.grid.appendChild(fragment);
                this.wrapper.appendChild(this.grid);
                this.parentContainer.appendChild(this.wrapper);
            }

            setupResizer() {
                // Tracks exact pixel bounds of the parent slot container
                this.resizeObserver = new ResizeObserver(entries => {
                    for (let entry of entries) {
                        const { width, height } = entry.contentRect;
                        this.resizeToFit(width, height);
                    }
                });
                this.resizeObserver.observe(this.parentContainer);
            }

            resizeToFit(parentWidth, parentHeight) {
                let targetWidth, targetHeight;
                const parentRatio = parentWidth / parentHeight;

                // Constrain limits by comparing component aspect ratio vs container bounds
                if (parentRatio > this.aspectRatio) {
                    // Container is wider than the target aspect ratio -> lock height
                    targetHeight = parentHeight;
                    targetWidth = targetHeight * this.aspectRatio;
                } else {
                    // Container is taller than the target aspect ratio -> lock width
                    targetWidth = parentWidth;
                    targetHeight = targetWidth / this.aspectRatio;
                }

                // Apply dimensional bounding styles
                this.wrapper.style.width = `${targetWidth}px`;
                this.wrapper.style.height = `${targetHeight}px`;

                // Calculate font scaling dynamically based on individual grid unit footprint
                const cellSize = targetWidth / this.width;
                this.grid.style.fontSize = `${cellSize}px`;
            }

            setPixel(x, y, char, color = '#fff') {
                if (x >= 0 && x < this.width && y >= 0 && y < this.height) {
                    const idx = y * this.width + x;
                    this.charBuffer[idx] = char.charAt(0);
                    this.colorBuffer[idx] = color;
                }
            }

            clear() {
                this.charBuffer.fill(this.defaultChar);
                this.colorBuffer.fill(this.defaultColor);
            }

            render() {
                for (let i = 0; i < this.totalCells; i++) {
                    const cellDom = this.domCache[i];
                    const nextChar = this.charBuffer[i];
                    const nextColor = this.colorBuffer[i];

                    if (cellDom.textContent !== nextChar) cellDom.textContent = nextChar;
                    if (cellDom.style.color !== nextColor) cellDom.style.color = nextColor;
                }
            }

            destroy() {
                this.resizeObserver.disconnect();
                this.wrapper.remove();
            }
        }

        // ----------------------------------------------------
        // INITIALIZE MULTIPLE INSTANCES
        // ----------------------------------------------------
        const terminalA = new ResponsiveAsciiTerminal('#slot-a', 120, 40, '.', '#1a3322');
        const terminalB = new ResponsiveAsciiTerminal('#slot-b', 40, 60, '+', '#221a33');

        // Animation Loop Tracking
        let frame = 0;
        function loop() {
            // --- ANIMATE TERMINAL A (Plasma Wave Loop) ---
            for (let y = 0; y < terminalA.height; y++) {
                for (let x = 0; x < terminalA.width; x++) {
                    const val = Math.sin(x * 0.15 + frame * 0.08) * Math.cos(y * 0.2 + frame * 0.05);
                    if (val > 0.4) {
                        terminalA.setPixel(x, y, '#', '#00ffaa');
                    } else if (val > 0) {
                        terminalA.setPixel(x, y, '=', '#00aa66');
                    } else if (val > -0.4) {
                        terminalA.setPixel(x, y, '-', '#005533');
                    } else {
                        terminalA.setPixel(x, y, '.', '#1a3322');
                    }
                }
            }
            // --- ANIMATE TERMINAL B (Expanding Bouncing Ball) ---
            terminalB.clear();
            const centerX = Math.floor(terminalB.width / 2 + Math.sin(frame * 0.04) * 12);
            const centerY = Math.floor(terminalB.height / 2 + Math.cos(frame * 0.06) * 20);
            for (let r = 8; r > 0; r -= 2) {
                const colors = ['#ff3366', '#ff9933', '#ffff33', '#33ccff'];
                const chars = ['@', 'O', 'o', '•'];
                const color = colors[r / 2 - 1] || '#fff';
                const char = chars[r / 2 - 1] || '*';
                for (let angle = 0; angle < Math.PI * 2; angle += 0.1) {
                    // Aspect ratio is fixed to 1:1 per cell via CSS, making standard math circles look perfectly round!
                    const px = Math.floor(centerX + Math.cos(angle) * r);
                    const py = Math.floor(centerY + Math.sin(angle) * r);
                    terminalB.setPixel(px, py, char, color);
                }
            }
            terminalA.render();
            terminalB.render();
            frame++;
            requestAnimationFrame(loop);
        }
        loop();
        // Control Panel Button Hooks
        document.getElementById('btn-clear').addEventListener('click', () => {
            terminalA.defaultChar = ' ';
            terminalB.defaultChar = ' ';
        });
        document.getElementById('btn-invert').addEventListener('click', () => {
            terminalA.defaultColor = '#222';
            terminalB.defaultColor = '#222';
        });
    </script>
</body>
</html>
